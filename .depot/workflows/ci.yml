# Generated by mountaya/ai (scripts/apply.mjs). Edit .agents/manifest.json instead.
#
# Part of the gate on Depot CI, as one job, a check on the commit in Entire: `mise run ci:linux`.
# The whole gate, `mise run ci` (tests and the build), runs only where you work. Pre-commit runs
# `mise run ci:quick` where the commit is made.
# The repositories the gate reads beside this one are fetched at the commits siblings.lock pins.
name: ci
on:
  push:
    branches: ["**"]
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
jobs:
  linux:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 90
    # Every step, setup included, runs as CI: a check that tolerates a missing input on a laptop insists here.
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          github_token: ${{ secrets.MISE_GITHUB_TOKEN }}
      - name: Siblings, at the commits siblings.lock pins
        run: sh .agents/siblings checkout
        env:
          DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
          SIBLINGS_REGISTRY: ${{ vars.SIBLINGS_REGISTRY }}
      - name: Gate
        run: mise run ci:linux

# Generated by mountaya/ai (scripts/apply.mjs). Edit .agents/manifest.json instead.
#
# The read-only public mirror of this repository on GitHub, kept by Depot CI:
# https://github.com/mountaya/sdk-swift. On every push of main and of a release tag (v*), it pushes
# Entire's main to the mirror's main, never forced, and every release tag, never moved or deleted.
# Whichever push starts it, it pushes everything, so a run dropped while it waits behind another
# loses nothing. Nothing else pushes to the mirror, and a mirror that diverged fails the run rather
# than being overwritten.
#
# Depot secrets and variables it reads, each limited to this repository:
#   secrets    MIRROR_DEPLOY_KEY, the private half of the mirror's deploy key, which may write
#   variables  MIRROR_URL, the mirror's SSH address
name: mirror
on:
  push:
    branches: ["main"]
    tags: ["v**"]
# One run at a time, and none cancelled once it runs: each pushes main and every release tag as
# Entire holds them when it starts.
concurrency:
  group: mirror-sdk-swift
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  mirror:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Every branch and tag, so Entire's main and every release tag are here whichever push this is.
          fetch-depth: 0
      - name: Entire's main and every release tag, to the mirror
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
          MIRROR_URL: ${{ vars.MIRROR_URL }}
        run: |
          set -euo pipefail
          # problem <what> [<next step>...]: what is wrong, and each thing to do about it.
          problem() {
            printf '✗ %s\n' "$1" >&2
            shift
            for step in "$@"; do printf '  %s\n' "$step" >&2; done
          }
          missing=no
          if [ -z "${MIRROR_URL:-}" ]; then
            problem "MIRROR_URL is not set: the Depot CI variable holding the mirror's SSH address." "depot ci vars add MIRROR_URL --repo mountaya/sdk-swift --value '<the SSH address of https://github.com/mountaya/sdk-swift>'"
            missing=yes
          fi
          if [ -z "${MIRROR_DEPLOY_KEY:-}" ]; then
            problem "MIRROR_DEPLOY_KEY is not set: the Depot CI secret holding the private half of the mirror's deploy key, which may write." "depot ci secrets add MIRROR_DEPLOY_KEY --repo mountaya/sdk-swift < <the private key's file>"
            missing=yes
          fi
          if [ "$missing" = yes ]; then
            echo "Then re-run this run: it pushes whatever the mirror still lacks." >&2
            exit 1
          fi
          main=$(git rev-parse -q --verify refs/remotes/origin/main) || {
            problem "This checkout has no origin/main, so Entire's main is not known here." "Re-run this run: its checkout fetches every branch."
            exit 1
          }
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$MIRROR_DEPLOY_KEY" >"$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          # GitHub's host keys, as its API publishes them over HTTPS, so no first connection is trusted blindly.
          curl --fail --silent --show-error https://api.github.com/meta |
            python3 -c 'import json, sys; [print("github.com", key) for key in json.load(sys.stdin)["ssh_keys"]]' >"$ssh_dir/known_hosts" || {
            problem "GitHub's host keys could not be read from https://api.github.com/meta." "Re-run this run."
            exit 1
          }
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"
          failed=no
          # Never forced: a mirror whose main holds a commit Entire's main does not stops here.
          if git push "$MIRROR_URL" "$main:refs/heads/main"; then
            echo "The mirror's main is at $main, where Entire's main is."
          else
            problem "The mirror refused main at $main. Where git says rejected above, the mirror's main holds commits Entire's main does not: it diverged, and this workflow never forces it." \
              "Compare the two before anything is overwritten: nothing but this workflow pushes to the mirror."
            failed=yes
          fi
          # Every release tag, never moved and never deleted: a tag the mirror holds at another commit stops here.
          if git push "$MIRROR_URL" 'refs/tags/v*:refs/tags/v*'; then
            echo "The mirror holds every release tag (v*)."
          else
            problem "The mirror refused a release tag. Where git says rejected above, the mirror holds that tag at another commit than Entire does, and this workflow never moves a tag there." \
              "A published tag stays where it is: release a new version instead of moving one."
            failed=yes
          fi
          [ "$failed" = no ]
